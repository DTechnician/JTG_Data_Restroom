version: 2

models:
  - name: fact_revenue
    description: |
      Fact table capturing revenue-related measures at the work order grain. Includes revenue, labor cost, and derived profit margin for each work order.
    columns:
      - name: work_order_sk
        description: |
          Surrogate key for the work order. Serves as the grain of the fact row and can be joined to the corresponding dimension record.
        tags: [key, work_order]
        tests:
          - not_null
          # Uncomment and update the "to" value to enforce referential integrity once the dimension exists
          # - relationships:
          #     to: ref('dim_work_order')
          #     field: work_order_sk

      - name: revenue
        description: |
          Total recognized revenue amount for the work order in the model's base currency.
          Calculation: Rate/Quantity/Service_Frequnce_Value(ref:service_frequency_mapping)
        tags: [metric, revenue]
        #tests:
        #  - not_null

      - name: labor_cost
        description: |
          Total direct labor cost attributed to the work order in the model's base currency.
          Calculation: Calculated TimeStamp Duration(ref:dim_work_order) * HourlyRate (ref:dim_site_division) / 60(min/hour)
        tags: [metric, cost, labor]
        #tests:
        #  - not_null

      - name: profit_margin
        description: |
          Profit margin represented as a decimal ratio for the work order.
          Calculation: (revenue - labor_cost)
          Values usually range from 0.0 to 1.0, but can be negative for loss‑making orders.
        tags: [kpi, margin]
        #tests:
        #  - not_null