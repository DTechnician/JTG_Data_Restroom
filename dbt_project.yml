# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'jtg_data_restroom'

version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files

clean-targets:
  - "target"
  - "dbt_packages"

# Configuring models
models:

  # ⬇️ Added persist_docs here for the entire project
  +persist_docs:
    relation: true
    columns: true

  jtg_data_restroom:
    # Applies to all files under models/example/
    10_staging:
      +materialized: table
      +tags: staging
      12_raw:
        +tags: raw
        +on_schema_change: append_new_columns
        +schema: raw
        +materialized: incremental
      13_prep:
        +tags: prep
        +on_schema_change: append_new_columns
        +schema: prep
        +materialized: view
    20_intermediate:
      +materialized: table
      +tags: int
      21_dims:
        +tags: dims
        +on_schema_change: append_new_columns
        +schema: jtg_dw
        +materialized: incremental
      22_facts:
        +tags: dims
        +on_schema_change: append_new_columns
        +schema: jtg_dw
        +materialized: incremental
      23_bridge:
        +tags: bridge
        +schema: jtg_dw
    30_reports_and_reconciliation:
      +materialized: view
      +tags: rec_report
      +schema: jtg_dw

flags:
  require_generic_test_arguments_property: true
